<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillsPool 2 Tailwind</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="font-sans">
    <!-- Nav -->
    <nav class="nav flex items-center justify-around py-5">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 hidden">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
        </svg>

        <!-- Logo -->
        <h1 class="font-bold text-4xl/[28px] text-[#2E8B57]">Skillpool</h1>

        <div class="nav_link_container flex items-center">
            <!-- nav links -->
            <div class="nav_links flex gap-4 mr-27.75">
                <a href="" class="font-medium text-base/5 text-[#4B5563]">Home</a>
                <a href="" class="font-medium text-base/5 text-[#4B5563]">How It Works</a>
                <a href="" class="font-medium text-base/5 text-[#4B5563]">About</a>
                <a href="" class="font-medium text-base/5 text-[#4B5563]">Contact Us</a>
            </div>
    
            <!-- action button -->
            <a href="" class="action bg-[#FF6A3D] rounded-[30px] text-white py-3.75 px-7.5 inline-block">POST A JOB</a>
        </div>
    </nav>
    <hr>

    <section class="hero">
        <!-- Hero Section -->
        <div class="overlay">
    
        </div>
        <div class="hero_content">
            <div>
                <span class="hero_icon_1">
                    <img src="./images/icons/hero_icon_1.svg" alt="">
                </span>
                <p>Are you an employer <br> looking to hire skilled <br> professionals?</p>
                <a href=""  class="hero_link_1">GET STARTED &nbsp; <img src="./images/icons/white_arrow.svg" alt=""></a>
            </div>
            
            <div>
                <span class="hero_icon_2">
                    <img src="./images/icons/hero_icon_2.svg" alt="" >
                </span>
                <p>Are you a <br> candidate looking <br> for a job?</p>
                <a href="" class="hero_link_2">GET STARTED &nbsp;  <img src="./images/icons/white_arrow.svg" alt="" ></a>
            </div>
        </div>
    </section>
</body>
</html>
